<title>5 minutes de maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
/* Layout : une colonne de téléphone, une carte « écran » à la fois (accueil, leçon, quiz, bilan). */
:root {
  --bg: #eef6f4; --surface: #ffffff; --ink: #16233a; --muted: #5b6d78; --line: #d5e4e1;
  --accent: #0e9a8a; --accent-soft: #d6f2ee; --on-accent: #ffffff;
  --flame: #e8661a; --good: #1d8f50; --good-soft: #dcf3e5; --bad: #c92f4a; --bad-soft: #fbe3e8; --hint: #fff4d6; --hint-ink: #7a5300;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math: "STIX Two Text", "Times New Roman", serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1a1e; --surface: #15262c; --ink: #e6f1ef; --muted: #93a9b0; --line: #26404a;
  --accent: #2cc4b0; --accent-soft: #123b39; --on-accent: #062421;
  --flame: #ff8a3d; --good: #4cc983; --good-soft: #143826; --bad: #ff6b85; --bad-soft: #3d1a22; --hint: #3a3016; --hint-ink: #f4d58a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1a1e; --surface: #15262c; --ink: #e6f1ef; --muted: #93a9b0; --line: #26404a;
  --accent: #2cc4b0; --accent-soft: #123b39; --on-accent: #062421;
  --flame: #ff8a3d; --good: #4cc983; --good-soft: #143826; --bad: #ff6b85; --bad-soft: #3d1a22; --hint: #3a3016; --hint-ink: #f4d58a;
  color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.app { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 800; }
h2 { font-size: 1.5rem; font-weight: 800; }
p { margin: 0; }
i { font-family: var(--f-math); font-size: 1.08em; }
sup { font-family: var(--f-math); }
.eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.spread { justify-content: space-between; }
.btn { font: 600 1rem var(--f-body); border: 0; border-radius: 999px; padding: 14px 20px; cursor: pointer; background: var(--accent); color: var(--on-accent); width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.btn:focus-visible, .choice:focus-visible, .key:focus-visible, input:focus-visible, .day:focus-visible { outline: 3px solid var(--flame); outline-offset: 2px; }
/* accueil */
.hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.streak { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; color: var(--flame); line-height: 1; }
.streak small { display: block; font: 500 .8rem var(--f-body); color: var(--muted); }
.monster { width: 112px; height: 112px; }
.monster.locked { filter: grayscale(1) opacity(.45); }
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--muted);
  font: 700 1.05rem var(--f-display); display: grid; place-items: center; cursor: default; position: relative; }
.day.open { border-color: var(--accent); color: var(--accent); cursor: pointer; }
.day.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); cursor: pointer; }
.day .s { position: absolute; bottom: 3px; font: 600 .62rem var(--f-body); }
.progress { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
/* leçon */
.lesson-head { background: var(--accent); color: var(--on-accent); border-radius: var(--r); padding: 16px 18px; }
.lesson-head .eyebrow { color: var(--on-accent); opacity: .85; }
.box { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.box .eyebrow { font-weight: 700; }
.box.rule { background: var(--surface); border: 2px solid var(--accent); }
.box.rule .eyebrow { color: var(--accent); }
.box.ex { background: var(--accent-soft); }
.box.trap { background: var(--bad-soft); }
.box.trap .eyebrow { color: var(--bad); }
.box ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
/* quiz */
.q { font-size: 1.05rem; }
.q .grand { display: inline-block; margin-top: 8px; font-size: 1.45rem; }
.choices { display: grid; gap: 10px; }
.choice { font: 500 1.15rem var(--f-body); text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.ok { border-color: var(--good); background: var(--good-soft); }
.choice.ko { border-color: var(--bad); background: var(--bad-soft); }
input.ans { font: 500 1.35rem var(--f-body); padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
.preview { min-height: 1.6em; font-size: 1.3rem; color: var(--muted); }
.keys { display: flex; flex-wrap: wrap; gap: 8px; }
.keys .key { min-width: 3.2rem; }
.key { font: 600 1.05rem var(--f-body); padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.msg { border-radius: 14px; padding: 12px 14px; font-size: .97rem; }
.msg.ok { background: var(--good-soft); color: var(--good); font-weight: 600; }
.msg.ko { background: var(--bad-soft); color: var(--bad); }
.msg.hint { background: var(--hint); color: var(--hint-ink); }
.msg.cor { background: var(--accent-soft); color: var(--ink); }
.dots { display: flex; gap: 6px; }
.dot { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.dot.now { background: var(--accent); opacity: .5; }
.dot.ok { background: var(--good); }
.dot.half { background: var(--flame); }
.dot.ko { background: var(--bad); }
.score { font: 800 3.4rem var(--f-display); color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.note { font-size: .8rem; color: var(--muted); }
.choice.niv { display: flex; flex-direction: column; gap: 4px; }
.rappel { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 8px; margin-bottom: 4px; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>

const CLE = "cinq-minutes-maths-v2";
function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || { faits: {} }; } catch (e) { return { faits: {} }; } }
function ecrire(s) { try { localStorage.setItem(CLE, JSON.stringify(s)); } catch (e) {} }
let etat = lire();
const auj = () => new Date().toISOString().slice(0, 10);

const NIVEAUX = ["facile", "moyen", "difficile"];
const NOMS = { facile: "Facile", moyen: "Moyen", difficile: "Difficile" };
const ETOILES = { facile: "⭐", moyen: "⭐⭐", difficile: "⭐⭐⭐" };
function serie() {
  const dates = new Set();
  Object.values(etat.faits).forEach(j => Object.values(j).forEach(f => dates.add(f.date)));
  let n = 0, d = new Date();
  if (!dates.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (dates.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// niveau atteint un jour : le plus haut niveau réussi avec au moins 5/6 (0 si aucun)
function niveauJour(n) {
  const f = etat.faits[n] || {};
  return NIVEAUX.reduce((m, v, i) => (f[v] && f[v].meilleur >= 5 ? i + 1 : m), 0);
}
const jourFait = n => !!etat.faits[n] && Object.keys(etat.faits[n]).length > 0;
// monstre du thème : les 15 jours réussis (≥ 5/6) au niveau facile → Bronze, moyen → Argent, difficile → Or
function niveauBadge() {
  const m = Math.min(...DONNEES.jours.map(j => niveauJour(j.n)));
  return [null, "bronze", "silver", "gold"][m];
}

// ---------------------------------------------------------------- analyse et vérification des expressions
function normaliser(s) {
  return s.replace(/²/g, "^2").replace(/³/g, "^3").replace(/[×·]/g, "*").replace(/[−–]/g, "-").replace(/,/g, ".").replace(/\s+/g, "").toLowerCase();
}
function analyser(src) {
  const t = []; let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/[0-9.]/.test(c)) { let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++; t.push({ k: "n", v: parseFloat(src.slice(i, j)) }); i = j; }
    else if (/[a-z]/.test(c)) { t.push({ k: "v", v: c }); i++; }
    else if ("+-*/^()".includes(c)) { t.push({ k: c }); i++; }
    else throw new Error("Caractère inconnu : " + c);
  }
  // multiplications implicites : 3x, 2(…), x(…), )x, )(…), xy
  const u = [];
  t.forEach((tk, j) => {
    const p = u[u.length - 1];
    if (p && (p.k === "n" || p.k === "v" || p.k === ")") && (tk.k === "v" || tk.k === "(" || (tk.k === "n" && p.k === ")"))) u.push({ k: "*" });
    u.push(tk);
  });
  let pos = 0;
  const vu = () => u[pos], prend = k => { if (!u[pos] || u[pos].k !== k) throw new Error("attendu " + k); return u[pos++]; };
  function somme() {
    const termes = [];
    let signe = 1;
    if (vu() && (vu().k === "+" || vu().k === "-")) { signe = vu().k === "-" ? -1 : 1; pos++; }
    termes.push({ signe, n: produit() });
    while (vu() && (vu().k === "+" || vu().k === "-")) { const s = vu().k === "-" ? -1 : 1; pos++; termes.push({ signe: s, n: produit() }); }
    return termes.length === 1 && termes[0].signe === 1 ? termes[0].n : { k: "add", termes };
  }
  function produit() {
    const f = [puissance()], ops = [];
    while (vu() && (vu().k === "*" || vu().k === "/")) { ops.push(vu().k); pos++; f.push(puissance()); }
    return f.length === 1 ? f[0] : { k: "mul", f, ops };
  }
  function puissance() {
    let b = primaire();
    if (vu() && vu().k === "^") { pos++; const neg = vu() && vu().k === "-" ? (pos++, true) : false; let e = primaire(); if (neg) e = { k: "neg", a: e }; b = { k: "pow", b, e }; }
    return b;
  }
  function primaire() {
    const tk = vu(); if (!tk) throw new Error("fin");
    if (tk.k === "n") { pos++; return { k: "num", v: tk.v }; }
    if (tk.k === "v") { pos++; return { k: "var", v: tk.v }; }
    if (tk.k === "(") { pos++; const e = somme(); prend(")"); return { k: "par", a: e }; }
    if (tk.k === "-") { pos++; return { k: "neg", a: puissance() }; }
    throw new Error("inattendu");
  }
  const arbre = somme();
  if (pos !== u.length) throw new Error("reste");
  return arbre;
}
function evaluer(n, env) {
  switch (n.k) {
    case "num": return n.v;
    case "var": if (!(n.v in env)) env[n.v] = 1 + Math.random() * 2.3; return env[n.v];
    case "par": return evaluer(n.a, env);
    case "neg": return -evaluer(n.a, env);
    case "pow": return Math.pow(evaluer(n.b, env), evaluer(n.e, env));
    case "add": return n.termes.reduce((s, t) => s + t.signe * evaluer(t.n, env), 0);
    case "mul": return n.f.reduce((p, f, i) => i === 0 ? evaluer(f, env) : (n.ops[i - 1] === "*" ? p * evaluer(f, env) : p / evaluer(f, env)), 0);
  }
}
function equivalents(a, b) {
  for (let essai = 0; essai < 6; essai++) {
    const env = {};
    for (const v of "abxyzt") env[v] = (essai % 2 ? -1 : 1) * (0.7 + Math.random() * 2.4);
    const va = evaluer(a, env), vb = evaluer(b, env);
    if (!isFinite(va) || Math.abs(va - vb) > 1e-6 * Math.max(1, Math.abs(vb))) return false;
  }
  return true;
}
function estReduit(arbre, termes) {
  const liste = arbre.k === "add" ? arbre.termes.map(t => t.n) : [arbre];
  if (liste.length !== termes) return false;
  let ok = true;
  const vus = new Set();
  for (const t of liste) {
    let nb = 0; const lettres = {};
    (function parcourir(n) {
      if (n.k === "par") ok = false;
      else if (n.k === "neg") parcourir(n.a);
      else if (n.k === "mul") n.f.forEach(parcourir);
      else if (n.k === "num") nb++;
      else if (n.k === "var") lettres[n.v] = (lettres[n.v] || 0) + 1;
      else if (n.k === "pow") { if (n.b.k === "var") lettres[n.b.v] = (lettres[n.b.v] || 0) + 1; else ok = false; }
      else if (n.k === "add") ok = false;
    })(t);
    if (nb > 1 || Object.values(lettres).some(c => c > 1)) ok = false;
    const sig = Object.keys(lettres).sort().join("") + "|" + JSON.stringify(t).replace(/"v":[0-9.]+/g, "");
    vus.add(sig);
  }
  return ok;
}
function estFactorise(arbre) {
  let r = arbre;
  while (r.k === "neg") r = r.a;
  const aPar = JSON.stringify(r).includes('"par"');
  return (r.k === "mul" || r.k === "pow") && aPar;
}
function apercu(s) {
  return s.replace(/\*/g, " · ").replace(/-/g, " − ").replace(/\+/g, " + ").replace(/\^(\d+)/g, "<sup>$1</sup>").replace(/([a-z])/g, "<i>$1</i>").replace(/²/g, "<sup>2</sup>").replace(/³/g, "<sup>3</sup>");
}

  app.innerHTML = `
    <div class="hero">
      <div><p class="eyebrow">5 minutes de maths par jour</p><h1>${DONNEES.theme}</h1></div>
      <div class="streak" title="Jours d'affilée">🔥 ${s}<small>${s > 1 ? "jours d'affilée" : "jour d'affilée"}</small></div>
    </div>
    <section class="card">
      <div class="row">
        <img class="monster ${niv ? "" : "locked"}" src="${DONNEES.badges[niv || "bronze"]}" alt="${DONNEES.monstre}${niv ? " " + niv : " (à débloquer)"}">
        <div>
          <h3>${niv ? DONNEES.monstre + " " + { bronze: "Bronze", silver: "Argent", gold: "Or" }[niv] + " débloqué !" : DONNEES.monstre + " t'attend"}</h3>
          <p class="note">Réussis les 15 jours (au moins 5/6) : en facile pour le Bronze, en moyen pour l'Argent, en difficile pour l'Or.</p>
        </div>
      </div>
      <div class="progress" aria-label="Progression"><div style="width:${faits / DONNEES.total_jours * 100}%"></div></div>
      <p class="note">${faits} jour${faits > 1 ? "s" : ""} sur ${DONNEES.total_jours} · ★ = niveau réussi</p>
    </section>
    <section class="card">
      <h3>Ton parcours</h3>
      <div class="days">${cases}</div>
    </section>
    ${prochain ? `<button class="btn" id="go">Jour ${prochain.n} : ${prochain.lecon.titre}</button>` : `<p class="note">Bravo, tu as fait les 15 jours ! Refais-en un à un niveau plus difficile pour faire évoluer ${DONNEES.monstre}.</p>`}
    <p class="note">Ta progression reste sur ce téléphone. Rien n'est envoyé.</p>`;
  app.querySelectorAll(".day[data-j]").forEach(b => b.onclick = () => lecon(+b.dataset.j));
  const go = document.getElementById("go"); if (go) go.onclick = () => lecon(prochain.n);
  window.scrollTo(0, 0);
}

function lecon(n) {
  const j = DONNEES.jours.find(x => x.n === n), L = j.lecon;
  app.innerHTML = `
    <button class="btn ghost" id="back">← Accueil</button>
    <div class="lesson-head"><p class="eyebrow">${DONNEES.theme} · jour ${n} / ${DONNEES.total_jours}</p><h2>${L.titre}</h2></div>
    <p>${L.intro}</p>
    <div class="box rule"><p class="eyebrow">La règle</p><p>${L.regle}</p></div>
    <div class="box ex"><p class="eyebrow">Exemples</p><ul>${L.exemple.map(e => `<li>${e}</li>`).join("")}</ul></div>
    <div class="box trap"><p class="eyebrow">Le piège</p><p>${L.piege}</p></div>
    <button class="btn" id="start">J'ai compris : je choisis mon niveau</button>`;
  document.getElementById("back").onclick = accueil;
  document.getElementById("start").onclick = () => choixNiveau(n);
  window.scrollTo(0, 0);
}

// quiz du jour : 6 questions du niveau choisi (une version tirée par emplacement)
function choixNiveau(n) {
  const f = etat.faits[n] || {};
  const desc = { facile: "Pour bien démarrer", moyen: "Avec des nombres négatifs et des puissances", difficile: "Pour les champions" };
  app.innerHTML = `
    <button class="btn ghost" id="back">← Revoir la leçon</button>
    <div><p class="eyebrow">Jour ${n}</p><h2>Choisis ton niveau</h2></div>
    <div class="choices">${NIVEAUX.map(v => `<button class="choice niv" data-v="${v}">
      <span class="row spread"><b>${ETOILES[v]} ${NOMS[v]}</b><span class="note">${f[v] ? "meilleur : " + String(f[v].meilleur).replace(".", ",") + "/6" : ""}</span></span>
      <span class="note">${desc[v]} · 6 questions</span></button>`).join("")}</div>`;
  document.getElementById("back").onclick = () => lecon(n);
  app.querySelectorAll(".niv").forEach(b => b.onclick = () => quiz(n, b.dataset.v));
  window.scrollTo(0, 0);
}

function quiz(n, niv) {
  const j = DONNEES.jours.find(x => x.n === n);
  const qs = j.niveaux[niv].map(pick);
  const N = qs.length;
  const res = [];
  let k = 0;
  function afficher() {
    const q = qs[k]; let essais = 0, fini = false;
    const dots = qs.map((_, i) => `<span class="dot ${i < k ? (res[i] === 1 ? "ok" : res[i] === 0.5 ? "half" : "ko") : i === k ? "now" : ""}"></span>`).join("");
    let zone = "";
    if (q.t === "choix") {
      const ordre = melange(q.ch.map((c, i) => [c, i]));
      zone = `<div class="choices">${ordre.map(([c, i]) => `<button class="choice" data-i="${i}">${c}</button>`).join("")}</div>`;
    } else {
      // touches utiles sur téléphone : les lettres de la réponse attendue, le carré et le signe moins
      const lettres = [...new Set((q.rep.match(/[a-z]/g) || []))];
      // exposant > 3 dans la réponse : bouton « ^ » (puissance), avec ² et ³ pour les cas courants
      const grandExp = /\^([4-9]|\d\d)/.test(q.rep);
      const touches = q.t === "num" ? ["−"] : [...lettres, "²", ...(/\^3/.test(q.rep) || grandExp ? ["³"] : []), ...(grandExp ? ["^"] : []), "−"];
      zone = `<label class="note" for="rep">Ta réponse</label>
        <input class="ans" id="rep" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${q.t === "num" ? "decimal" : "text"}" placeholder="${q.t === "num" ? "un nombre" : q.forme === "factorise" ? "ex. 3(x + 2)" : "ex. 3x² − 5x"}">
        <p class="note">Puissance : tape <b>^</b> puis l'exposant (x^5 = x<sup>5</sup>).</p>
        <div class="preview" id="prev"></div>
        <div class="keys">${touches.map(t => `<button class="key" data-t="${t}">${t}</button>`).join("")}</div>`;
    }
    app.innerHTML = `
      <div class="row spread"><p class="eyebrow">Jour ${n} · ${NOMS[niv]} · ${k + 1} / ${N}</p><button class="btn ghost" id="quit" style="width:auto;padding:6px 14px">Quitter</button></div>
      <div class="dots">${dots}</div>
      <section class="card"><div class="q">${q.q}</div>${zone}<div id="fb"></div>
      <button class="btn" id="val">Valider</button></section>`;
    document.getElementById("quit").onclick = accueil;
    const fb = document.getElementById("fb"), val = document.getElementById("val");
    let choisi = null;
    if (q.t === "choix") {
      app.querySelectorAll(".choice").forEach(b => b.onclick = () => { if (fini) return; app.querySelectorAll(".choice").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); choisi = +b.dataset.i; });
    } else {
      const inp = document.getElementById("rep"), prev = document.getElementById("prev");
      const maj = () => { prev.innerHTML = inp.value ? apercu(normaliser(inp.value).replace(/\*/g, "·")) : ""; };
      inp.oninput = maj;
      inp.onkeydown = e => { if (e.key === "Enter") val.click(); };
      app.querySelectorAll(".key").forEach(b => b.onclick = () => { inp.value += b.dataset.t; maj(); inp.focus(); });
      setTimeout(() => inp.focus(), 50);
    }
    function terminer(pts) {
      fini = true; res[k] = pts;
      val.textContent = k < N - 1 ? "Question suivante" : "Voir mon bilan";
      val.onclick = () => { k++; k < N ? afficher() : bilan(n, niv, res); };
    }
    val.onclick = () => {
      if (fini) return;
      let juste = false, presque = false;
      if (q.t === "choix") {
        if (choisi === null) { fb.innerHTML = `<p class="msg hint">Choisis une réponse.</p>`; return; }
        juste = choisi === 0;
      } else {
        const v = document.getElementById("rep").value;
        if (!v.trim()) { fb.innerHTML = `<p class="msg hint">Écris ta réponse.</p>`; return; }
        try {
          if (q.t === "num") juste = Math.abs(parseFloat(normaliser(v)) - parseFloat(q.rep)) < 1e-9;
          else {
            const a = analyser(normaliser(v)), b = analyser(normaliser(q.rep));
            if (equivalents(a, b)) {
              if (q.forme === "reduit" && !estReduit(a, q.termes)) presque = "reduit";
              else if (q.forme === "factorise" && !estFactorise(a)) presque = "factorise";
              else juste = true;
            }
          }
        } catch (e) { fb.innerHTML = `<p class="msg hint">Je n'arrive pas à lire ta réponse. Écris par exemple <b>3x^2 - 5x + 1</b> (ou utilise les touches).</p>`; return; }
      }
      if (presque === "reduit") { fb.innerHTML = `<p class="msg hint">C'est juste, mais pas encore réduit : regroupe les termes semblables et écris le résultat le plus simplement possible.</p>`; return; }
      if (presque === "factorise") { fb.innerHTML = `<p class="msg hint">C'est juste, mais ce n'est pas factorisé : écris le résultat sous forme d'un produit, par exemple 3(x + 2).</p>`; return; }
      essais++;
      if (juste) {
        if (q.t === "choix") app.querySelector(`.choice[data-i="${choisi}"]`).classList.add("ok");
        fb.innerHTML = `<p class="msg ok">${essais === 1 ? "Bravo ! ✓" : "Juste au deuxième essai ✓"}</p><p class="msg cor">${q.cor}</p>`;
        terminer(essais === 1 ? 1 : 0.5);
      } else if (essais === 1) {
        if (q.t === "choix") app.querySelector(`.choice[data-i="${choisi}"]`).classList.add("ko");
        fb.innerHTML = `<p class="msg ko">Pas encore. Réessaie une fois !</p><p class="msg hint">💡 ${q.ind}</p>`;
      } else {
        if (q.t === "choix") { app.querySelector(`.choice[data-i="${choisi}"]`).classList.add("ko"); app.querySelector(`.choice[data-i="0"]`).classList.add("ok"); }
        fb.innerHTML = `<p class="msg ko">Pas cette fois. Voici la correction :</p><p class="msg cor">${q.cor}</p>`;
        terminer(0);
      }
    };
  }
  afficher();
}

function bilan(n, niv, res) {
  const score = res.reduce((s, v) => s + v, 0);
  const avant = niveauBadge();
  etat.faits[n] = etat.faits[n] || {};
  const f = etat.faits[n][niv];
  etat.faits[n][niv] = { meilleur: Math.max(score, f ? f.meilleur : 0), date: auj() };
  ecrire(etat);
  const apres = niveauBadge();
  const nouveau = apres && apres !== avant;
  const mot = score === 6 ? "Parfait !" : score >= 5 ? "Très bien !" : score >= 3 ? "C'est en route !" : "Courage, tu vas y arriver !";
  const suivant = NIVEAUX[NIVEAUX.indexOf(niv) + 1];
  app.innerHTML = `
    <section class="card" style="text-align:center;align-items:center">
      <p class="eyebrow">Jour ${n} · ${ETOILES[niv]} ${NOMS[niv]}</p>
      <div class="score">${String(score).replace(".", ",")}<span style="font-size:1.6rem">/6</span></div>
      <h2>${mot}</h2>
      <p>🔥 Série : <b>${serie()}</b> jour${serie() > 1 ? "s" : ""} d'affilée</p>
      ${nouveau ? `<img class="monster" src="${DONNEES.badges[apres]}" alt="${DONNEES.monstre}"><h3>Tu as débloqué ${DONNEES.monstre} ${{ bronze: "Bronze", silver: "Argent", gold: "Or" }[apres]} !</h3>` : ""}
      <p class="note">Meilleur score à ce niveau : ${String(etat.faits[n][niv].meilleur).replace(".", ",")}/6.</p>
    </section>
    <button class="btn" id="home">Retour à l'accueil</button>
    ${score >= 5 && suivant ? `<button class="btn ghost" id="up">Essayer le niveau ${NOMS[suivant].toLowerCase()} ${ETOILES[suivant]}</button>` : ""}
    <button class="btn ghost" id="again">Refaire ce niveau</button>`;
  document.getElementById("home").onclick = accueil;
  document.getElementById("again").onclick = () => quiz(n, niv);
  const up = document.getElementById("up"); if (up) up.onclick = () => quiz(n, suivant);
  window.scrollTo(0, 0);
}

accueil();
</script>
